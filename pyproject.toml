[project]
name = "aircalib"
version = "1.0.0"
description = "Corriger un capteur de particules à 30 € (SDS011) à partir des stations officielles : version simplifiée."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "polars>=1.30.0",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.6.0",
]

[dependency-groups]
dev = ["ruff>=0.12.0"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

