# Central configuration for the air-calib pipeline.
# Every threshold, date or URL used by the code lives here (no magic values in src/).
# Any key can be overridden with an environment variable, e.g.
#   AIRCALIB_PERIOD__START=2025-01-01

paths:
  data_dir: data
  reports_dir: reports
  # `--sample` runs write their layers (raw/bronze/silver/gold) under data/<sample_subdir>/;
  # the discovery reference tables in data/meta are shared by both modes.
  sample_subdir: sample

period:
  start: 2024-01-01
  end: 2025-12-31

study:
  main_country: DE      # training / cross-validation zone
  transfer_country: FR  # out-of-domain transfer test

http:
  user_agent: "air-calib/0.1 (+https://github.com/lwdata75/air-calib; student research project)"
  max_concurrency: 8        # polite limit for community-run servers
  max_retries: 5
  backoff_base_s: 1.0       # wait = base * 2**attempt (+ jitter)
  backoff_max_s: 60.0
  timeout_s: 180.0          # an archive day listing takes ~65 s to render
  progress_log_s: 60.0      # long downloads log their progress at this interval

sensor_community:
  archive_url: https://archive.sensor.community
  live_snapshot_url: https://data.sensor.community/static/v2/data.json
  # Particle sensors we can calibrate (P1 = PM10, P2 = PM2.5).
  pm_types: [sds011, pms5003, pms7003, sps30]
  # Probes that report relative humidity (BMP180/BMP280 do not).
  humidity_types: [bme280, dht22, sht30, sht31, sht35, sht85, htu21d]
  # Bytes fetched with an HTTP Range request to read a file's first rows.
  head_bytes: 2048
  # Columns kept in bronze (the archive also has durP1/ratioP1/durP2/ratioP2,
  # altitude, pressure_sealevel: always empty, checked at conversion time).
  pm_columns: [P1, P2]
  humidity_columns: [temperature, humidity, pressure]
  timestamp_format: "%Y-%m-%dT%H:%M:%S"
  # Raw sensor-day files (~1.3 M gzip files) are deleted once converted to bronze.
  keep_raw: false
  # Sensor-months downloaded in parallel (their day requests share the HTTP limit above).
  unit_workers: 4

discovery:
  # One archive listing per month on this day-of-month gives the sensors
  # active over the period without listing all 731 days (~65 s each).
  sample_day_of_month: 15
  # Day listings are heavy (~5 MB rendered in ~65 s): the server drops connections
  # when too many run at once.
  listing_concurrency: 2
  # Countries whose sensors we resolve positions for.
  countries: [DE, FR]
  radii_km: [0.5, 1.0, 1.5, 2.0, 3.0]
  # Timezone check: close pairs and number of days used for lag cross-correlation.
  lag_check_pairs_per_country: 4
  lag_check_max_distance_km: 0.5
  lag_check_start: 2025-01-06
  lag_check_days: 14
  lag_check_max_lag_h: 3
  # Sensor age: sensor ids are allocated in sequence, so listings since the archive's
  # start (twice a year before the study period) date each id's registration.
  history_start_year: 2016
  history_months: [1, 7]

eea:
  api_url: https://eeadmz1-downloads-api-appservice.azurewebsites.net
  metadata_url: "https://discomap.eea.europa.eu/App/AQViewer/download?fqn=Airquality_Dissem.b2g.measurements&f=csv"
  pollutant_vocabulary: http://dd.eionet.europa.eu/vocabulary/aq/pollutant
  pollutants:
    pm25: 6001
    pm10: 5
  # 2 = E1a (verified), 1 = E2a (unverified, up-to-date). Never evaluate on E2a.
  dataset: 2
  aggregation: hour
  # Hourly-capable measurement types (gravimetric "active" samplers are daily).
  measurement_types: [automatic]
  # Declared station clocks kept in scope: mainland DE (UTC+01) and FR (UTC).
  # Overseas French stations (UTC-04, UTC-03, UTC+03, UTC+04) follow other clocks.
  timezones: ["UTC", "UTC+01"]
  # Validity codes kept as usable reference values (1 valid, 2 valid below detection limit, 3 valid below DL substituted).
  valid_codes: [1, 2, 3]
  verified_codes: [1]
  missing_sentinel: -999.0
  # Raw files (full 2013+ history, ~1 MB each) are deleted once bronze holds them: discovery caches
  # what it needs from them (monthly availability) in data/meta.
  keep_raw: false
  # Bronze keeps the study period plus this margin (Start is on the station clock).
  bronze_margin_days: 1
  # Measured in step 1 (lagged correlation, DE and FR): UTC hour = Start - clock_offset_h.
  clock_offset_h: 1
  # Validated hours may be slightly negative (instrument noise around zero: 0.18 % of PM2.5 hours,
  # median -0.8 ug/m3). They are kept as reported (clipping or dropping them would bias the target
  # upwards in clean air); below this floor a value is no longer noise and is flagged.
  negative_floor_ugm3: -5.0
  # Reference instrument families, from the EEA "Measurement Method" (feature and result breakdown).
  # light-scat = optical aerosol spectrometer (FR: Fidas 200; DE: model not given), OPC-CMC = Fidas,
  # nephelometry+beta = hybrid (e.g. SHARP 5030), BETA = beta attenuation (BAM), TEOM = microbalance.
  method_classes:
    light-scat: optical
    OPC-CMC: optical
    nephelometry+beta: nephelometry_beta
    BETA: beta
    TEOM: teom
    TEOM-FDMS: teom
  method_unknown: unknown

pairing:
  # Rule: 1 sensor = 1 station, the nearest one with verified data while the sensor is active.
  radius_download_km: 3.0   # every pair up to this distance is downloaded
  radius_train_km: 1.5      # pairs <= 1.5 km train the model; (1.5, 3] km = "distance" test set
  sensor_types: [sds011]    # PMS/SPS sensors excluded (2 % of pairs, other optics)

particles:
  # SDS011 specification range for PM2.5 and PM10 (ug/m3).
  max_ugm3: 999.9
  # Saturation signature seen in the archive: PM2.5 = 999.9 together with PM10 = 1999.9 (firmware cap).
  pm25_saturation_ugm3: 999.9
  pm10_saturation_ugm3: 1999.9
  # Identical (PM10, PM2.5) readings lasting at least this long = stuck sensor. Real air above
  # 1 ug/m3 never stays identical for an hour; the long plateaus are 0/0, < 1, -1 and 999.9 while
  # the reference station reads 5-7 ug/m3 (notebook 03).
  stuck_min_hours: 1.0
  # A long plateau is "stuck" only if it is a known failure code (PM10, PM2.5) -- the -1/-1 error and
  # the 999.9 cap are caught by earlier rules -- or if the reference station moved by at least
  # stuck_reference_range_ugm3 meanwhile (same 5 ug/m3 bound as the EEA noise floor). Otherwise a
  # repeated small value may be real clean air (clean hours were over-represented, notebook 03).
  stuck_codes: [[0.0, 0.0]]
  stuck_reference_range_ugm3: 5.0
  # A sensor's cadence = median gap between consecutive readings, per sensor and month, ignoring
  # gaps longer than this (outages).
  cadence_max_gap_s: 3600
  # An hour is kept when its valid readings reach this share of the readings expected at the cadence.
  min_completeness: 0.75

humidity:
  # A reading is classified as: missing (null or NaN), out of range (< 0 or > max_pct), stuck low
  # (< floor_pct), saturated (>= saturation_pct) or usable. Only usable readings are measurements.
  saturation_pct: 99.9
  max_pct: 100.0
  # Official stations read < 5 % RH in 9 hours out of 5.27 M (DE + FR, 2024-2025); a DHT22 stuck
  # at exactly 1.0 % is a probe failure, not dry air (notebook 02, section 7).
  floor_pct: 5.0
  # Probe age classes (years since the sensor id was registered) for the saturation analysis.
  age_breaks_years: [1, 2, 4, 6]
  # An hour is faulty when more than this share of its readings are not usable.
  faulty_hour_share: 0.5
  # A probe-month faulty in more than this share of its hours is a "dead" probe for that month
  # (no reliable local humidity at all); below it, only the faulty hours are discarded.
  # Chosen on the full 2024-2025 data (notebook 02, section 7.1): 0.3 sits in the trough of the
  # distribution, and above it even the usable hours drift away from the official station
  # (DHT22 median bias +13.8 points, BME280 +2.7 and growing).
  dead_month_share: 0.3
  # A usable humidity value repeated identically for at least this long is stuck: during such runs
  # the official station moved by 6 to 50 points (median), against 2 points for runs under 2 h.
  stuck_min_hours: 3.0
  # Several probes on one site (16 sites have a DHT22 and a BME280): the first reliable one wins.
  probe_preference: [sht85, sht31, sht30, bme280, dht22, htu21d]

weather:
  # Official weather stations used as a fallback for the sensor's own humidity probe.
  n_nearest: 2              # keep a second station in case the first one has gaps
  max_distance_km: 30.0
  # Clock check of weather stations against the probes' temperature (10-min windows).
  clock_check_step_min: 10
  clock_check_max_offset_min: 120
  # Per pair, the official station nearest to the *sensor* is chosen; two stations closer than this
  # to each other in distance are a tie, broken by humidity completeness. An hour missing at the
  # chosen station falls back to the other one.
  tie_km: 0.5

clock:
  # Automatic check on every pair (silver): lagged correlation of hourly PM2.5, sensor vs station.
  max_lag_h: 3
  # The test uses hour-to-hour changes (sharp peak at the true offset). A pair is "unverifiable" with
  # fewer common hours than min_hours, or when even its best correlation is below min_r (its changes
  # carry no readable timing). A non-zero best lag is a mismatch only when it beats lag 0 by
  # min_z (Fisher z, as if the two correlations were independent: conservative here).
  min_hours: 500
  min_r: 0.1
  min_z: 3.0
  # Instruments known to respond late: a station (or pair) of this method class whose best lag is
  # this value is flagged "instrument_lag" and KEPT (not a clock error). TEOM: ~1/2 h late.
  instrument_lag_h:
    teom: 1

dwd:
  # Hourly 2 m temperature + relative humidity (quality-controlled "historical" release).
  base_url: https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/hourly/air_temperature/historical
  station_list: TU_Stundenwerte_Beschreibung_Stationen.txt
  station_list_encoding: latin-1
  missing_sentinel: -999.0
  keep_raw: false

meteo_france:
  # Hourly climatological data ("donnees climatologiques de base - horaires"), one gzip CSV
  # per department and period; resource URLs are read from the data.gouv.fr dataset API.
  dataset_api_url: https://www.data.gouv.fr/api/1/datasets/donnees-climatologiques-de-base-horaires/
  resource_title_regex: "^HOR_departement_(?P<department>[0-9AB]+)_periode_(?P<first_year>\\d{4})-(?P<last_year>\\d{4})$"
  # Commune centres (one request) tell which departments lie near a station.
  communes_url: "https://geo.api.gouv.fr/communes?fields=code,codeDepartement,centre&format=json&type=commune-actuelle"
  department_aliases: {"2A": "20", "2B": "20"}   # Corsica is one file for Meteo-France
  columns: [NUM_POSTE, NOM_USUEL, LAT, LON, ALTI, AAAAMMJJHH, T, QT, U, QU]
  keep_raw: false

evaluation:
  # US EPA performance targets for PM2.5 sensors (Duvall et al., 2021, EPA/600/R-20/280), for a sensor
  # regressed on the reference: R2 >= 0.70, slope 1 +- 0.35, intercept -5..+5 ug/m3, RMSE <= 7 ug/m3.
  # The EPA states them for 24-h means; the project also reports them hourly.
  epa_r2_min: 0.70
  epa_slope_range: [0.65, 1.35]
  epa_intercept_range: [-5.0, 5.0]
  epa_rmse_max: 7.0
  # A pair is evaluated with at least this many usable hours / complete days.
  min_hours: 500
  min_days: 30
  # A day counts when both sides have at least this many valid hours (75 % of 24).
  daily_min_hours: 18
  # Bins for the error analysis (official relative humidity in %, reference PM2.5 in ug/m3).
  humidity_bins: [50, 60, 70, 80, 90, 95]
  level_bins: [5, 10, 15, 25, 50]

physics:
  # Two-parameter physical model (step 5), fitted on the training pairs only:
  #   PM_ref ~ a * PM_raw / C(RH),  C = 1 + (kappa / density_ratio) / (1 / a_w - 1),  a_w = RH / 100
  # i.e. ln PM_ref = ln a + ln PM_raw - ln C(RH): a = gain (the raw SDS011 under-reads), kappa = hygroscopicity.
  density_ratio: 1.65       # particle / water density ratio, fixed (only kappa / density_ratio is identifiable)
  kappa_bounds: [0.0, 1.0]  # ambient aerosol: ~0.1-0.6 (Petters & Kreidenweis, 2007)
  # C diverges as RH -> 100 %: RH is capped at this value (official hygrometers are +-2-3 % near saturation, and
  # the fit barely improves below it: 90 % -> MSE 0.4847, 95 % -> 0.4855, 99 % -> 0.4969 on ln PM).
  rh_cap_pct: 95.0
  fit_grid_points: 101      # coarse grid on kappa, then golden-section refinement
  fit_tolerance: 1.0e-5

features:
  # ln of PM values below this floor is taken at the floor: below ~1 ug/m3 the reference is at its noise level
  # (validated negatives down to -5, median -0.8), so ln(0.2) vs ln(0.8) would be noise with a large weight.
  # 12 % of raw sensor hours and 0.6 % of reference hours are below it (training zone).
  log_floor_ugm3: 1.0
  # Time features in local civil time (Germany and France share it): traffic and heating follow it, not UTC.
  local_timezone: Europe/Paris
  # Rolling statistics over the PAST only: hours (h - w, h], the current hour included, never a later one.
  rolling_hours: [3, 6, 24]
  # Share of hours without a valid sensor value over the previous w hours (current hour excluded).
  missing_window_hours: [24, 168]
  # Magnus dew-point formula (Alduchov & Eskridge, 1996), T in C.
  dew_point_a: 17.62
  dew_point_b: 243.12
  # Citizen neighbours: other paired sensors within this radius, at least this many valid at the hour.
  # 3 km: 69 % of usable hours have >= 3 valid neighbours (1 km: 22 %, 5 km: 80 %).
  neighbour_radius_km: 3.0
  neighbour_min: 3

cv:
  # Station-wise folds (GroupKFold): a station and ALL its pairs (both bands) are in one fold.
  n_folds: 5

health:
  # Sensor health from citizen neighbours only (no reference): hourly changes of ln PM vs the neighbours'
  # median, over hours with enough neighbours.
  min_hours: 500
  # A sensor is flagged "suspect" below this correlation: the same bound as clock.min_r, by analogy
  # (the precision / recall at other thresholds is shown in notebook 05).
  change_corr_min: 0.1

sample:
  # Small but representative subset: per country, sensors spread over the distance range.
  n_sensors_per_country: 10
  month: 2025-01-01
